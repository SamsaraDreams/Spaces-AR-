<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Papel tapiz en tu pared</title>
<style>
:root{--ink:#24221b;--glass:rgba(36,34,27,.74);--bone:#f1ebdc;--taupe:#cdbf9a;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--bone);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
#ov{pointer-events:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:16px}
#top{position:fixed;left:12px;right:12px;top:calc(var(--sat) + 10px);padding:10px 14px;text-align:center;font-weight:600}
#panel{position:fixed;left:10px;right:10px;bottom:calc(var(--sab) + 10px);padding:10px}
.row{display:flex;gap:8px}
button{flex:1;padding:12px 4px;border:0;border-radius:12px;background:rgba(241,235,220,.14);color:var(--bone);font:600 14px inherit;touch-action:manipulation}
button.on,button.p{background:var(--taupe);color:var(--ink)}
details{margin-top:8px}summary{padding:6px 2px;color:var(--taupe);font-weight:600}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 2px}
input[type=range]{width:55%}
input[type=number],select{width:90px;padding:6px;border-radius:8px;border:0;background:rgba(241,235,220,.16);color:var(--bone);font:inherit}
#start{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px;background:linear-gradient(160deg,#3a3628,#24221b 70%);z-index:5}
#start h1{margin:0;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
#start p{margin:0;max-width:34ch;color:#d9d1bd}
#start .row{flex-direction:column;max-width:340px}
#start button{padding:15px}
.hide{display:none!important}
</style></head><body>
<video id="vid" playsinline muted autoplay style="position:fixed;width:2px;height:2px;opacity:0;pointer-events:none"></video>
<canvas id="gl"></canvas><canvas id="ov"></canvas>
<div id="top" class="glass hide"></div>
<div id="panel" class="glass hide">
 <div class="row">
  <button id="bReset">Reiniciar</button>
  <button id="bCmp">Ver original</button>
  <button id="bFreeze">Congelar</button>
  <button id="bShot" class="p">Captura</button>
 </div>
 <details><summary>Ajustes</summary>
  <label>Ancho de la pared (m)<input id="iW" type="number" min="0.5" max="12" step="0.1" value="3"></label>
  <label>Alto de la pared (m)<input id="iH" type="number" min="0.5" max="6" step="0.1" value="2.6"></label>
  <label>Pared actual<select id="sAlb"><option value=".75">Clara</option><option value=".45">Media</option><option value=".2">Oscura</option></select></label>
  <label>Adaptar a la luz<input id="rLight" type="range" min="0" max="1" step=".05" value=".85"></label>
  <label>Brillo<input id="rBr" type="range" min=".6" max="1.4" step=".05" value="1"></label>
  <label>Uniones entre lienzos<input id="cSeam" type="checkbox"></label>
 </details>
</div>
<div id="start">
 <h1>Papel tapiz en tu pared</h1>
 <p>Apunta a una pared y toca sus cuatro esquinas. El papel se ajusta a su perspectiva, con la luz del cuarto.</p>
 <div class="row"><button id="bCam" class="p">Abrir cámara</button><button id="bPhoto">Usar una foto</button></div>
 <input id="file" type="file" accept="image/*" class="hide">
</div>

const cv=$('gl'), ov=$('ov'), octx=ov.getContext('2d'), vid=$('vid');
const gl=cv.getContext('webgl',{preserveDrawingBuffer:true,antialias:false});
const VS='attribute vec2 a;varying vec2 vUv;void main(){vUv=a*.5+.5;gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;varying vec2 vUv;
uniform sampler2D uVid,uWp;uniform mat3 uHi;uniform vec2 uVs,uRep;uniform vec3 uCast;
uniform float uOn,uOp,uAL,uAlb,uLight,uBr,uSeam;
float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
void main(){
 vec2 t=vec2(vUv.x,1.-vUv.y), vc=(t-.5)*uVs+.5;
 vec3 v=texture2D(uVid,vc).rgb;
 vec3 p=uHi*vec3(gl_FragCoord.xy,1.); vec2 q=p.xy/p.z;
 float e=min(min(q.x,1.-q.x),min(q.y,1.-q.y));
 float m=smoothstep(0.,.004,e)*uOn;
 if(m<=0.){gl_FragColor=vec4(v,1.);return;}
 vec3 wp=texture2D(uWp,q*uRep).rgb;
 float ll=0.;
 for(int i=0;i<8;i++){float a=float(i)*.785398;vec2 d=vec2(cos(a),sin(a));
  ll+=lum(texture2D(uVid,vc+d*.015).rgb)+lum(texture2D(uVid,vc+d*.04).rgb);}
 ll/=16.;
 float Em=pow(max(uAL,.03),2.2);
 float rel=clamp(pow(max(ll,.01),2.2)/Em,.45,1.7);
 float E=Em/uAlb*mix(1.,rel,uLight);
 E*=1.+(lum(v)-ll)*uLight*1.2;
 E=clamp(E,.2,1.3)*uBr;
 vec3 c=pow(clamp(pow(wp,vec3(2.2))*E*mix(vec3(1.),uCast,.5),0.,1.),vec3(1./2.2));
 float d=abs(fract(q.x*uRep.x+.5)-.5)/uRep.x*uRep.x;
 c*=1.-.1*uSeam*(1.-smoothstep(0.,.012,d));
 gl_FragColor=vec4(mix(v,c,m*uOp),1.);
}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;}

const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={};['uVid','uWp','uHi','uVs','uRep','uCast','uOn','uOp','uAL','uAlb','uLight','uBr','uSeam'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));

mkTex(0);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
mkTex(1);gl.uniform1i(U.uVid,0);gl.uniform1i(U.uWp,1);
const wimg=new Image();wimg.onload=()=>{gl.activeTexture(gl.TEXTURE1);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,wimg);gl.generateMipmap(gl.TEXTURE_2D);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
 const an=gl.getExtension('EXT_texture_filter_anisotropic');if(an)gl.texParameterf(gl.TEXTURE_2D,an.TEXTURE_MAX_ANISOTROPY_EXT,Math.min(8,gl.getParameter(an.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));};

let src=null,pts=[],drag=-1,frozen=false,needUp=false,cmp=false,shot=false,dpr=1,CW=0,CH=0,Hi=null,AL=.55,cast=[1,1,1];
const still=document.createElement('canvas'),sc=document.createElement('canvas');sc.width=48;sc.height=27;const sx=sc.getContext('2d',{willReadFrequently:true});

function resize(){dpr=Math.min(window.devicePixelRatio||1,2);CW=innerWidth;CH=innerHeight;
 for(const c of [cv,ov]){c.width=Math.round(CW*dpr);c.height=Math.round(CH*dpr);}gl.viewport(0,0,cv.width,cv.height);}
addEventListener('resize',resize);resize();

function sqToQuad(P){const [x0,y0,x1,y1,x2,y2,x3,y3]=P.flat();
 const dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3,den=dx1*dy2-dx2*dy1;
 const g=(dx3*dy2-dx2*dy3)/den,h=(dx1*dy3-dx3*dy1)/den;
 return [x1-x0+g*x1,x3-x0+h*x3,x0,y1-y0+g*y1,y3-y0+h*y3,y0,g,h,1];}
function inv3(m){const [a,b,c,d,e,f,g,h,i]=m,A=e*i-f*h,B=-(d*i-f*g),C=d*h-e*g,det=a*A+b*B+c*C;
 return [A,-(b*i-c*h),b*f-c*e,B,a*i-c*g,-(a*f-c*d),C,-(a*h-b*g),a*e-b*d].map(x=>x/det);}
function order(p){const cx=p.reduce((s,q)=>s+q[0],0)/4,cy=p.reduce((s,q)=>s+q[1],0)/4;

 let k=0;p.forEach((q,i)=>{if(q[0]+q[1]<p[k][0]+p[k][1])k=i;});return p.slice(k).concat(p.slice(0,k));}
function update(){if(pts.length<4){Hi=null;return;}
 Hi=inv3(sqToQuad(pts.map(q=>[q[0]*dpr,(CH-q[1])*dpr])));}

function sample(w,h){ // luz media de la pared y tinte de la escena
 sx.drawImage(src,0,0,48,27);const d=sx.getImageData(0,0,48,27).data;let sw=0,sl=0,fr=0,fg=0,fb=0;
 const va=w/h,ca=CW/CH,vs=ca>va?[1,va/ca]:[ca/va,1];
 for(let j=0;j<27;j++)for(let i=0;i<48;i++){const k=(j*48+i)*4,r=d[k]/255,g=d[k+1]/255,b=d[k+2]/255;fr+=r;fg+=g;fb+=b;
  if(!Hi)continue;const tx=((i+.5)/48-.5)/vs[0]+.5,ty=((j+.5)/27-.5)/vs[1]+.5,X=tx*CW*dpr,Y=(1-ty)*CH*dpr,
  z=Hi[6]*X+Hi[7]*Y+Hi[8],u=(Hi[0]*X+Hi[1]*Y+Hi[2])/z,v=(Hi[3]*X+Hi[4]*Y+Hi[5])/z;
  if(u>0&&u<1&&v>0&&v<1){sw++;sl+=.299*r+.587*g+.114*b;}}
 if(sw>5)AL+=(sl/sw-AL)*.35;const n=1296,m=[fr/n,fg/n,fb/n],ml=.299*m[0]+.587*m[1]+.114*m[2]||1;
 cast=cast.map((c,i)=>c+(Math.min(1.2,Math.max(.8,m[i]/ml))-c)*.35);}

let lastS=0;
function frame(t){requestAnimationFrame(frame);if(!src)return;
 const isV=src===vid,w=isV?vid.videoWidth:src.width,h=isV?vid.videoHeight:src.height;if(!w)return;
 if((isV&&!frozen)||needUp){gl.activeTexture(gl.TEXTURE0);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,src);needUp=false;}
 if(t-lastS>400&&!frozen){lastS=t;sample(w,h);}
 const va=w/h,ca=CW/CH;gl.uniform2f(U.uVs,...(ca>va?[1,va/ca]:[ca/va,1]));
 gl.uniformMatrix3fv(U.uHi,false,Hi?[Hi[0],Hi[3],Hi[6],Hi[1],Hi[4],Hi[7],Hi[2],Hi[5],Hi[8]]:[1,0,0,0,1,0,0,0,1]);

 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
 if(shot){shot=false;cv.toBlob(b=>{const f=new File([b],'papel-tapiz.png',{type:'image/png'}),dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='papel-tapiz.png';a.click();};
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(dl);else dl();});}
 octx.setTransform(dpr,0,0,dpr,0,0);octx.clearRect(0,0,CW,CH);
 if(pts.length){octx.strokeStyle='#cdbf9a';octx.fillStyle='#f1ebdc';octx.lineWidth=2;octx.setLineDash(pts.length<4?[6,5]:[]);
  octx.beginPath();pts.forEach((q,i)=>i?octx.lineTo(q[0],q[1]):octx.moveTo(q[0],q[1]));if(pts.length===4)octx.closePath();octx.stroke();

addEventListener('pointerdown',e=>{if(!src||e.target.closest('#panel,#start'))return;const p=[e.clientX,e.clientY];
 if(pts.length<4){pts.push(p);if(pts.length===4)pts=order(pts);update();return;}

 }catch(e){alert('No pude abrir la cámara ('+e.name+'). Permite el acceso en Safari o prueba con una foto.');}};

$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height));
 still.width=Math.round(im.width*k);still.height=Math.round(im.height*k);still.getContext('2d').drawImage(im,0,0,still.width,still.height);
 src=still;needUp=true;pts=[];update();begin();$('bFreeze').classList.add('hide');};im.src=URL.createObjectURL(f);};
$('bReset').onclick=()=>{pts=[];update();};
$('bShot').onclick=()=>{shot=true;};
$('bCmp').onpointerdown=()=>{cmp=true;};['pointerup','pointerleave','pointercancel'].forEach(n=>$('bCmp').addEventListener(n,()=>{cmp=false;}));
$('bFreeze').onclick=()=>{frozen=!frozen;$('bFreeze').classList.toggle('on',frozen);$('bFreeze').textContent=frozen?'Descongelar':'Congelar';};
</script></body></html>
