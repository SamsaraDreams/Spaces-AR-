# .github/workflows/ios.yml
# CI para WallpaperAR – compila y testea el dominio puro en macOS.
# No requiere iPhone ni simulador para los tests de dominio.
# El artefacto .ipa se genera en el job de build (requiere firma).
#
# Disparadores: push a main o feature/*, PR hacia main.

name: iOS CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:

  # ── 1. Tests de dominio (Linux) ──────────────────────────────────────
  # El paquete Swift es puro → corre en Ubuntu, gratis y rápido.
  domain-tests-linux:
    name: Domain Tests (Linux / Swift)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Swift package tests
        run: swift test --parallel 2>&1

  # ── 2. Build iOS (macOS) ─────────────────────────────────────────────
  # Genera el .xcodeproj con XcodeGen y compila para iPhone genérico.
  build-ios:
    name: Build iOS (macOS / Xcode)
    runs-on: macos-15
    needs: domain-tests-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build for generic iOS device
        run: |
          xcodebuild \
            -project WallpaperAR.xcodeproj \
            -scheme WallpaperAR \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build \
            | xcpretty || true
          # xcpretty formatea la salida; "|| true" evita fallo si xcpretty no está
          # La compilación real sí falla si hay errores (xcodebuild exit code)

      - name: Install xcpretty
        if: false   # desactivado por defecto; activar si se quiere output limpio
        run: gem install xcpretty --no-document

      - name: Run domain tests (macOS)
        run: swift test --parallel 2>&1

      # ── Artefacto sin firma (para inspección, no instalable) ──────────
      # Para instalar en iPhone real usar Sideloadly con el .ipa firmado.
      # Para distribución TestFlight agregar job de firma con certificados.
      - name: Archive build products
        if: github.ref == 'refs/heads/main'
        run: |
          xcodebuild \
            -project WallpaperAR.xcodeproj \
            -scheme WallpaperAR \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -archivePath ${{ runner.temp }}/WallpaperAR.xcarchive \
            archive 2>&1 | tail -20

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperAR-unsigned
          path: ${{ runner.temp }}/WallpaperAR.xcarchive
          retention-days: 7
