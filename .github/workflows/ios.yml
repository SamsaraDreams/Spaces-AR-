# .github/workflows/ios.yml
# CI para WallpaperAR
#
# Job 1 (Linux): tests de dominio puro Swift – gratis y rápido
# Job 2 (macOS): XcodeGen → build → archive → exportar .ipa sin firma
#
# El .ipa sin firma se descarga desde GitHub Actions → instalar con Sideloadly.
# Para TestFlight añadir secrets de firma (Fase futura).

name: iOS CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:

  # ── 1. Tests de dominio (Linux) ──────────────────────────────────────
  domain-tests-linux:
    name: Domain Tests (Linux / Swift)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Swift package tests
        run: swift test --parallel

  # ── 2. Build iOS + .ipa (macOS) ──────────────────────────────────────
  build-ios:
    name: Build iOS (macOS / Xcode)
    runs-on: macos-15
    needs: domain-tests-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build for generic iOS device
        run: |
          xcodebuild \
            -project WallpaperAR.xcodeproj \
            -scheme WallpaperAR \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Run domain tests (macOS)
        run: swift test --parallel

      # ── Generar .ipa sin firma (solo en push a main) ──────────────────
      - name: Archive app
        if: github.ref == 'refs/heads/main'
        run: |
          xcodebuild \
            -project WallpaperAR.xcodeproj \
            -scheme WallpaperAR \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -archivePath "${{ runner.temp }}/WallpaperAR.xcarchive" \
            archive

      - name: Export unsigned .ipa
        if: github.ref == 'refs/heads/main'
        run: |
          # Empaqueta el .app del archive en un .ipa sin firma
          # compatible con Sideloadly / AltStore
          ARCHIVE="${{ runner.temp }}/WallpaperAR.xcarchive"
          APP_PATH=$(find "$ARCHIVE/Products" -name "*.app" | head -1)
          IPA_DIR="${{ runner.temp }}/ipa_payload"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          cd "$IPA_DIR"
          zip -r "${{ runner.temp }}/WallpaperAR-unsigned.ipa" Payload
          echo "✅ .ipa generado: $(du -sh ${{ runner.temp }}/WallpaperAR-unsigned.ipa)"

      - name: Upload .ipa artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperAR-unsigned
          path: ${{ runner.temp }}/WallpaperAR-unsigned.ipa
          retention-days: 7
