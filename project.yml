# XcodeGen – genera WallpaperAR.xcodeproj sin necesidad de Xcode local
# Uso: xcodegen generate (en CI macOS runner)
# Documentación: https://github.com/yonaskolb/XcodeGen

name: WallpaperAR
options:
  bundleIdPrefix: com.samsaradreams
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"          # 1 = iPhone
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM debe ser el Team ID de Apple Developer (10 caracteres
    # alfanuméricos, ej. "A1B2C3D4E5"), NUNCA un nombre de empresa como
    # "Tesseract Solutions" — ese valor no es un Team ID válido y Xcode no
    # puede resolver firma automática (CODE_SIGN_STYLE: Automatic) con él.
    # El CI no firma (CODE_SIGNING_ALLOWED=NO más abajo), así que esto solo
    # importa al compilar localmente en Xcode. Se deja sin valor hasta que
    # exista una cuenta de Apple Developer inscrita; Xcode pedirá elegir
    # el equipo de firma interactivamente la primera vez que se abra.
    # DEVELOPMENT_TEAM: ""

targets:

  # ── App principal ─────────────────────────────────────────────────────
  WallpaperAR:
    type: application
    platform: iOS
    sources:
      - path: WallpaperAR/App
      - path: WallpaperAR/Domain
      - path: WallpaperAR/Features
      - path: WallpaperAR/Services
      - path: WallpaperAR/Resources
    resources:
      - WallpaperAR/Resources
    info:
      path: WallpaperAR/App/Info.plist
      properties:
        CFBundleDisplayName: "Space interiorismo AR"
        # UILaunchScreen (dict vacío) es el idioma soportado por iOS 14+ para
        # "sin storyboard de lanzamiento, pasar directo al contenido SwiftUI".
        # UILaunchStoryboardName: "" (cadena vacía) NO es una configuración
        # válida: en pruebas previas dejó la pantalla de lanzamiento sin
        # transicionar nunca a ContentView (pantalla en blanco indefinida,
        # percibida como "la app no tiene interfaz"). Se sustituye por
        # UILaunchScreen para forzar la transición inmediata a SwiftUI.
        UILaunchScreen: {}
        # Permisos de privacidad — iOS exige descripción clara del uso
        NSCameraUsageDescription: "Necesitamos la cámara para visualizar el papel tapiz en tus paredes."
        NSPhotoLibraryAddUsageDescription: "Para guardar capturas de la visualización en tu galería."
        # Declaración de cifrado — la app no usa criptografía propia
        # Evita el cuestionario de exportación en App Store Connect
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities:
          # armv7 (32-bit) se retira: iOS 17 exige arm64, ningún dispositivo
          # soportado por este deploymentTarget usa armv7. Declararlo solo
          # restringe innecesariamente la disponibilidad en la App Store.
          - arkit
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        INFOPLIST_FILE: WallpaperAR/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.samsaradreams.wallpaperar
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: SceneKit.framework

  # ── Tests del dominio (sin ARKit, corren en CI) ───────────────────────
  WallpaperARTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WallpaperAR/Tests
      - WallpaperAR/Domain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samsaradreams.wallpaperar.tests
        TEST_HOST: ""
        BUNDLE_LOADER: ""
